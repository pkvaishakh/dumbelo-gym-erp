# Local services for development: Postgres (the database) and Redis (background jobs, from the WhatsApp step on).
# Start with: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rackline
      POSTGRES_PASSWORD: rackline
      POSTGRES_DB: rackline
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
