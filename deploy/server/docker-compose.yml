# Dumbelo on one server (a DigitalOcean droplet, an Oracle Cloud VM, any Linux server with Docker).
# Guide: docs/deploy-server.md.
# Settings come from .env next to this file (copy .env.example). Start or update everything with:
#   docker compose up -d --build
#
# Only Caddy is reachable from the internet (ports 80 and 443). It gets the HTTPS certificates and passes
# api.<domain> to the API and app.<domain> to the web app. Postgres and Redis publish no ports at all.
name: dumbelo

# The API image runs four ways (docs/deploy.md): the migration, the web process, the worker and beat.
x-api: &api
  build:
    context: ../../api
    args:
      APP_VERSION: ${APP_VERSION:-dev}
      DEPLOYED_AT: ${DEPLOYED_AT:-}
  image: dumbelo-api
  restart: unless-stopped
  environment:
    PRODUCTION: "true"
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
    FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in .env}
    ALLOWED_HOSTS: ${API_DOMAIN:?set API_DOMAIN in .env}
    CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?set APP_DOMAIN in .env}
    DATABASE_URL: postgres://dumbelo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/dumbelo
    # Two databases on the one Redis, so emptying the cache can't take the job queue with it.
    CACHE_URL: redis://redis:6379/1
    CELERY_BROKER_URL: redis://redis:6379/0
    WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-fake}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dumbelo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dumbelo
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dumbelo -d dumbelo"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    # Written to disk, so jobs waiting in the queue survive a restart.
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]

  # Runs the migrations once and exits; the API, worker and beat start only after it succeeds.
  migrate:
    <<: *api
    command: python manage.py migrate --noinput
    restart: "no"
    healthcheck: {disable: true}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  api:
    <<: *api
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *api
    command: celery -A config worker --loglevel=info
    healthcheck: {disable: true}  # the image's check asks port 8000, which only the API listens on
    depends_on:
      migrate: {condition: service_completed_successfully}

  # The clock. Exactly one (docs/deploy.md, "The worker and beat").
  beat:
    <<: *api
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    healthcheck: {disable: true}
    depends_on:
      migrate: {condition: service_completed_successfully}

  web:
    build:
      context: ../../web
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    image: dumbelo-web
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data      # the certificates: keep them, or Let's Encrypt's weekly limit can lock you out
      - caddyconfig:/config
    depends_on: [api, web]

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
