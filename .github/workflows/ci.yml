# Every push to main and every pull request runs the same three checks a developer runs before saying
# something is done (see the root CLAUDE.md): the API tests, the web checks, and the Playwright flows.
name: CI

on:
  push:
    branches: [main]  # a pull request's own commits are covered by the trigger below, so only main here
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Not a secret: it only signs tokens for throwaway CI databases. Servers set their own (see api/.env.example).
  SECRET_KEY: ci-only-not-a-secret-0123456789abcdef
  NEXT_PUBLIC_API_URL: http://localhost:8000
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    services:
      # Postgres, not the SQLite fallback, because that is what the servers run.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rackline
          POSTGRES_PASSWORD: rackline
          POSTGRES_DB: rackline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rackline -d rackline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rackline:rackline@localhost:5432/rackline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    name: Flows
    needs: [api, web]  # no point driving a browser through a build that is already broken
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rackline
          POSTGRES_PASSWORD: rackline
          POSTGRES_DB: rackline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rackline -d rackline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rackline:rackline@localhost:5432/rackline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the API
        working-directory: api
        run: pip install -r requirements.txt
      - name: Build the demo gym
        working-directory: api
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo --reset
      - name: Start the API
        working-directory: api
        run: |
          nohup python manage.py runserver 0.0.0.0:8000 --noreload > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8000/api/docs/ && exit 0
            sleep 2
          done
          echo "The API never answered on port 8000:"
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Install the web app
        working-directory: web
        run: npm ci
      - name: Build the web app
        working-directory: web
        run: npm run build  # the flows run against `npm run start`, so they need the production build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run the flows
        working-directory: web
        run: npm run e2e

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14
      - name: Keep the API's log of a failed run
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"
