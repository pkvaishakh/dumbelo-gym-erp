# Every push to main and every pull request runs the checks a developer runs before saying something is done
# (see the root CLAUDE.md): the API tests, the web checks and the Playwright flows — plus the image a server
# runs, and the whole one-server stack behind Caddy, so a deploy can never be the first time anyone builds it
# (docs/deploy.md, PRODUCTION.md).
name: CI

on:
  push:
    branches: [main]  # a pull request's own commits are covered by the trigger below, so only main here
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Not a secret: it only signs tokens for throwaway CI databases. Servers set their own (see api/.env.example).
  SECRET_KEY: ci-only-not-a-secret-0123456789abcdef
  NEXT_PUBLIC_API_URL: http://localhost:8000
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    services:
      # Postgres, not the SQLite fallback, because that is what the servers run.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dumbelo
          POSTGRES_PASSWORD: dumbelo
          POSTGRES_DB: dumbelo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dumbelo -d dumbelo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://dumbelo:dumbelo@localhost:5432/dumbelo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  image:
    name: API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image a server runs
        run: docker build -t dumbelo-api:ci api
      - name: Start it and ask whether it is well
        run: |
          # No DATABASE_URL, so the container falls back to SQLite: enough to prove gunicorn serves and the
          # health check answers. What it talks to on a server is in docs/deploy.md.
          docker run -d --name dumbelo-api -p 8000:8000 dumbelo-api:ci
          for _ in $(seq 1 20); do
            body=$(curl -fsS http://localhost:8000/api/health/ || true)
            case "$body" in *'"status":"ok"'*) echo "$body"; exit 0 ;; esac
            sleep 3
          done
          echo "The image never answered on port 8000:"
          docker logs dumbelo-api
          exit 1
      - name: Stop it
        if: always()
        run: docker rm -f dumbelo-api || true

  server:
    name: Server stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: deploy/server
    env:
      # Caddy gives *.localhost names certificates from its own authority, so the whole stack runs here exactly as on a
      # server, HTTPS included, with no domain. curl is told the names are this machine, and -k accepts that authority.
      DOMAIN: localhost
      EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v4
      - name: Make the settings with PRODUCTION.md's own commands
        run: |
          cp .env.example .env
          sed -i "s|^API_DOMAIN=.*|API_DOMAIN=api.$DOMAIN|; s|^APP_DOMAIN=.*|APP_DOMAIN=app.$DOMAIN|; s|^ACME_EMAIL=.*|ACME_EMAIL=$EMAIL|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 50)|" .env
          sed -i "s|^FIELD_ENCRYPTION_KEY=.*|FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')|" .env
          if grep -E '^[A-Z_]+=$' .env; then echo "Those settings are empty"; exit 1; fi
      - name: Start everything
        run: docker compose up -d --build
      - name: Ask the API, through Caddy, whether it is well
        run: |
          for _ in $(seq 1 60); do
            body=$(curl -sk --resolve api.localhost:443:127.0.0.1 https://api.localhost/api/health/ || true)
            case "$body" in *'"status":"ok"'*) echo "$body"; exit 0 ;; esac
            sleep 3
          done
          echo "The API never answered through Caddy"
          exit 1
      - name: Check the protections
        run: |
          fail=0
          check() { if grep -qiE "$2" <<<"$1"; then echo "ok    $3"; else echo "FAIL  $3"; fail=1; fi; }
          absent() { if grep -qiE "$2" <<<"$1"; then echo "FAIL  $3"; fail=1; else echo "ok    $3"; fi; }

          app=$(curl -sk -D - -o /dev/null --resolve app.localhost:443:127.0.0.1 https://app.localhost/)
          check "$app" '^HTTP/[0-9.]+ (200|307|308)' "the web app answers"
          check "$app" '^strict-transport-security: max-age=31536000; includeSubDomains' "web: HSTS"
          check "$app" '^x-frame-options: DENY' "web: X-Frame-Options"
          check "$app" "^content-security-policy: frame-ancestors 'none'" "web: frame-ancestors"
          check "$app" '^x-content-type-options: nosniff' "web: nosniff"
          check "$app" '^referrer-policy: strict-origin-when-cross-origin' "web: referrer policy"
          check "$app" '^permissions-policy: camera=\(self\)' "web: permissions policy"
          absent "$app" '^(server|x-powered-by):' "web: no server name"

          api=$(curl -sk -D - -o /dev/null --resolve api.localhost:443:127.0.0.1 https://api.localhost/api/health/)
          check "$api" '^strict-transport-security: max-age=31536000' "api: HSTS"
          check "$api" '^x-frame-options: DENY' "api: X-Frame-Options"
          check "$api" '^x-content-type-options: nosniff' "api: nosniff"
          absent "$api" '^server:' "api: no server name"

          redirect=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --resolve app.localhost:80:127.0.0.1 http://app.localhost/)
          check "$redirect" '^30[18] https://app.localhost/' "http:// goes to https://"

          big=$(head -c 11000000 /dev/zero | curl -sk -o /dev/null -w '%{http_code}' --resolve api.localhost:443:127.0.0.1 \
            -H 'Content-Type: application/json' --data-binary @- https://api.localhost/api/auth/login/ || true)
          check "$big" '^413$' "a request over 10 MB is refused"

          for port in 5432 6379 8000 3000; do
            if (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null; then echo "FAIL  port $port is open"; fail=1; else echo "ok    port $port is closed"; fi
          done
          exit $fail
      - name: Show what went wrong
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 80
      - name: Stop it
        if: always()
        run: docker compose down -v || true

  e2e:
    name: Flows
    needs: [api, web]  # no point driving a browser through a build that is already broken
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dumbelo
          POSTGRES_PASSWORD: dumbelo
          POSTGRES_DB: dumbelo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dumbelo -d dumbelo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://dumbelo:dumbelo@localhost:5432/dumbelo
      # The flows sign in as the demo admin a dozen times in under two minutes, from one address: more than the
      # sign-in limits a real person gets (10 a minute per account). Only this job's API is told to allow it.
      THROTTLE_LOGIN: 1000/min
      THROTTLE_LOGIN_IP: 1000/min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the API
        working-directory: api
        run: pip install -r requirements.txt
      - name: Build the demo gym
        working-directory: api
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo --reset
      - name: Start the API
        working-directory: api
        run: |
          nohup python manage.py runserver 0.0.0.0:8000 --noreload > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8000/api/docs/ && exit 0
            sleep 2
          done
          echo "The API never answered on port 8000:"
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Install the web app
        working-directory: web
        run: npm ci
      - name: Build the web app
        working-directory: web
        run: npm run build  # the flows run against `npm run start`, so they need the production build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run the flows
        working-directory: web
        run: npm run e2e

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14
      - name: Keep the API's log of a failed run
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"
