          readOnly: true
        gym:
          type: integer
          readOnly: true
          nullable: true
          description: Empty for Dumbelo's shared number
        gym_name:
          type: string
          readOnly: true
          nullable: true
        is_shared:
          type: boolean
          readOnly: true
        waba_id:
          type: string
          readOnly: true
          description: Meta's id for the WhatsApp Business account
        phone_number_id:
          type: string
          readOnly: true
          description: Meta's id for the number, which messages are sent through
        display_number:
          type: string
          readOnly: true
          description: The number people see, e.g. +91 98000 00000
        verified_name:
          type: string
          readOnly: true
          description: The name Meta shows, from the last Test Connection
        access_token_last4:
          type: string
          readOnly: true
        app_secret_last4:
          type: string
          readOnly: true
        webhook_url:
          type: string
          readOnly: true
          description: Typed into Meta's webhook settings, with the verify token
        verify_token:
          type: string
          readOnly: true
          description: Meta sends it back to prove the webhook is ours
        status:
          allOf:
          - $ref: '#/components/schemas/WhatsappAccountStatusEnum'
          readOnly: true
        checked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When Test Connection last ran
        last_error:
          type: string
          readOnly: true
          description: Why the last Test Connection failed, in Meta's words
        template_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - access_token_last4
      - app_secret_last4
      - checked_at
      - created_at
      - display_number
      - gym
      - gym_name
      - id
      - is_shared
      - last_error
      - phone_number_id
      - status
      - template_count
      - verified_name
      - verify_token
      - waba_id
      - webhook_url
    WhatsAppAccountCreateRequest:
      type: object
      description: Add Account. No gym means Dumbelo's shared number.
      properties:
        waba_id:
          type: string
          minLength: 1
          description: Meta's WhatsApp Business account id
          pattern: ^\d{5,32}$
        phone_number_id:
          type: string
          minLength: 1
          description: Meta's phone number id (not the number itself)
          pattern: ^\d{5,32}$
        display_number:
          type: string
          minLength: 1
          pattern: ^\+?[\d ()-]{6,23}$
        gym:
          type: integer
          nullable: true
          description: The gym whose own number this is; leave out for Dumbelo's shared
            number
        access_token:
          type: string
          writeOnly: true
          minLength: 20
          description: A permanent access token for the number (a system user's)
          maxLength: 1024
        app_secret:
          type: string
          writeOnly: true
          minLength: 16
          description: The Meta app's secret, which signs its webhook calls
          maxLength: 256
      required:
      - access_token
      - app_secret
      - display_number
      - phone_number_id
      - waba_id
    WhatsAppDay:
      type: object
      properties:
        delivered_today:
          type: integer
          description: On every number
        failed_today:
          type: integer
        waiting_retry:
          type: integer
        shared_messages:
          type: integer
          description: Billable messages on the shared number delivered this month
        shared_paise:
          type: integer
          description: What those come to, at the rate kept on each
      required:
      - delivered_today
      - failed_today
      - shared_messages
      - shared_paise
      - waiting_retry
    WhatsAppTemplate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        account:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/MessageKindEnum'
          readOnly: true
        kind_label:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
          description: The template's name in Meta, e.g. plan_ending_v2
        language:
          type: string
          readOnly: true
          default: en
          description: Meta's language code, e.g. en or en_US
        category:
          allOf:
          - $ref: '#/components/schemas/WhatsappCategoryEnum'
          readOnly: true
        body:
          type: string
          readOnly: true
          description: The text as Meta approved it, with {{1}}, {{2}}… where the
            details go
        parameters:
          type: array
          items:
            type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/WhatsappTemplateStatusEnum'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account
      - body
      - category
      - id
      - kind
      - kind_label
      - language
      - name
      - parameters
      - status
      - updated_at
    WhatsAppTemplateInputRequest:
      type: object
      description: Add Template and Edit Template. On an edit, what's left out stays
        as it was.
      properties:
        account:
          type: integer
          description: Only when adding
        kind:
          $ref: '#/components/schemas/MessageKindEnum'
        name:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^[a-z0-9_]{1,512}$
        language:
          type: string
          minLength: 1
          default: en
          pattern: ^[a-z]{2,3}(_[A-Z]{2})?$
        category:
          allOf:
          - $ref: '#/components/schemas/WhatsappCategoryEnum'
          default: utility
        body:
          type: string
          minLength: 1
          description: The text as Meta approved it, with {{1}}, {{2}}…
          maxLength: 1024
        parameters:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 40
          description: Which detail fills {{1}}, {{2}}…, in order
          maxItems: 10
        status:
          allOf:
          - $ref: '#/components/schemas/WhatsappTemplateStatusEnum'
          default: pending
      required:
      - account
      - body
      - kind
      - name
      - parameters
    WhatsappAccountStatusEnum:
      enum:
      - new
      - working
      - failing
      type: string
      description: |-
        * `new` - Not checked yet
        * `working` - Working
        * `failing` - Not working
    WhatsappCategoryEnum:
      enum:
      - utility
      - marketing
      - authentication
      type: string
      description: |-
        * `utility` - Utility
        * `marketing` - Marketing
        * `authentication` - Authentication
    WhatsappModeEnum:
      enum:
      - shared
      - own
      - 'off'
      type: string
      description: |-
        * `shared` - Dumbelo's number
        * `own` - The gym's own number
        * `off` - Off
    WhatsappTemplateStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - paused
      - disabled
      type: string
      description: |-
        * `pending` - Waiting for Meta
        * `approved` - Approved
        * `rejected` - Rejected
        * `paused` - Paused
        * `disabled` - Disabled
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
