  /api/platform/messages/:
    get:
      operationId: platform_messages_list
      description: |-
        Console → WhatsApp log: every message sent, newest first, across gyms. Filter by gym, WhatsApp account,
        template, message and status, between two days or billed in a month, or search with `q`. Read-only. Shows no names and no words:
        a message says who it was to and what they owe, and that is the gym's (only the number's last 4 digits).
      parameters:
      - in: query
        name: account
        schema:
          type: integer
      - in: query
        name: billed_in
        schema:
          type: string
        description: 'YYYY-MM: only the shared-number messages billed in that month,
          each gym''s days its own, as WhatsApp usage counts them'
      - in: query
        name: from
        schema:
          type: string
        description: Sent on or after this day (India time), YYYY-MM-DD
      - in: query
        name: gym
        schema:
          type: integer
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - dumbelo_invoice_due
          - dumbelo_payment_received
          - payment_due
          - payment_received
          - plan_ending
          - plan_ends_today
          - task_assigned
        description: |-
          * `plan_ending` - Plan ending soon
          * `plan_ends_today` - Plan ends today
          * `payment_due` - Payment due
          * `payment_received` - Payment received
          * `task_assigned` - Task assigned
          * `dumbelo_invoice_due` - Dumbelo invoice due
          * `dumbelo_payment_received` - Dumbelo payment received
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: The number it went to (4 digits or more), Meta's message id,
          or the error, 2 characters or more
      - in: query
        name: status
        schema:
          type: string
          enum:
          - delivered
          - failed
          - queued
          - read
          - sent
        description: |-
          * `queued` - Sending
          * `sent` - Sent
          * `delivered` - Delivered
          * `read` - Read
          * `failed` - Failed
      - in: query
        name: template
        schema:
          type: integer
      - in: query
        name: to
        schema:
          type: string
        description: Sent on or before this day (India time), YYYY-MM-DD
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConsoleMessageList'
          description: ''
