  /api/usernames/check/:
    get:
      operationId: usernames_check_retrieve
      description: |-
        Is this username free? If not, why, and some free ones made from what was typed, the email or the name.

        For gym staff (Add Staff, a member's app login, their own username in More) and Dumbelo admins (the Console).
        A taken username answers whose it is, so the desk adding someone who already signs in sees it's the right
        person; never for a Dumbelo team login.
      parameters:
      - in: query
        name: email
        schema:
          type: string
        description: Suggestions start from the part before the @
      - in: query
        name: name
        schema:
          type: string
        description: Suggestions start from the name when there's no email
      - in: query
        name: username
        schema:
          type: string
        description: What they typed; leave out for suggestions only
      tags:
      - usernames
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameCheck'
          description: ''
components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/AccountKindEnum'
        label:
          type: string
          readOnly: true
          description: The bank account's name, or the branch's name and cash
        name:
          type: string
          description: 'Bank accounts: what the gym calls it, like HDFC current account'
          maxLength: 80
        branch:
          type: integer
          nullable: true
          description: 'Cash in hand: the branch whose cash it is'
        branch_name:
          type: string
          readOnly: true
          nullable: true
        branches:
          type: array
          items:
            type: integer
          description: 'Bank accounts: the branches that use it. A branch using another
            account moves here'
        branch_names:
          type: array
          items:
            type: string
          readOnly: true
        bank_name:
          type: string
          maxLength: 80
        account_number:
          type: string
          maxLength: 20
        ifsc:
          type: string
          maxLength: 11
        opening_balance_paise:
          type: integer
          maximum: 100000000000
          minimum: 0
          format: int64
        opened_on:
          type: string
          format: date
          readOnly: true
          description: 'The day it was added to Dumbelo: money recorded from then
            on moves its balance'
        is_active:
          type: boolean
          readOnly: true
        balance_paise:
          type: integer
          readOnly: true
        collected_paise:
          type: integer
          readOnly: true
          description: Payments taken into it since it was added
        spent_paise:
          type: integer
          readOnly: true
          description: Expenses paid from it since it was added
        refunded_paise:
          type: integer
          readOnly: true
          description: Refunds given from it since it was added
        moved_in_paise:
          type: integer
          readOnly: true
        moved_out_paise:
          type: integer
          readOnly: true
      required:
      - balance_paise
      - branch_name
      - branch_names
      - collected_paise
      - id
      - is_active
      - kind
      - label
      - moved_in_paise
      - moved_out_paise
      - opened_on
      - refunded_paise
      - spent_paise
    AccountBrief:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        balance_paise:
          type: integer
        shared_with:
          type: array
          items:
            type: string
          description: Other branches that use this bank account
      required:
      - balance_paise
      - id
      - name
      - shared_with
    AccountKindEnum:
      enum:
      - cash
      - bank
      type: string
      description: |-
        * `cash` - Cash in hand
        * `bank` - Bank account
    AccountRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/AccountKindEnum'
        name:
          type: string
          description: 'Bank accounts: what the gym calls it, like HDFC current account'
          maxLength: 80
        branch:
          type: integer
          nullable: true
          description: 'Cash in hand: the branch whose cash it is'
        branches:
          type: array
          items:
            type: integer
          description: 'Bank accounts: the branches that use it. A branch using another
            account moves here'
        bank_name:
          type: string
          maxLength: 80
        account_number:
          type: string
          maxLength: 20
        ifsc:
          type: string
          maxLength: 11
        opening_balance_paise:
          type: integer
          maximum: 100000000000
          minimum: 0
          format: int64
      required:
      - kind
    AccountStatement:
      type: object
      properties:
        from:
          type: string
          format: date
          description: 'The first day shown: the month''s first, or the day the account
            was added'
        to:
          type: string
          format: date
          description: 'The last day shown: the month''s last, or today'
        opening_paise:
          type: integer
          description: The balance before the first day
        closing_paise:
          type: integer
          description: The balance after the last day
        in_paise:
          type: integer
        out_paise:
          type: integer
        cleared_paise:
          type: integer
          description: 'Bank accounts: the opening balance and the ticked entries
            up to the last day shown'
        reconciled:
          allOf:
          - $ref: '#/components/schemas/Reconciliation'
          nullable: true
          description: The latest check against the bank's statement
        entries:
          type: array
          items:
            $ref: '#/components/schemas/StatementEntry'
      required:
      - cleared_paise
      - closing_paise
      - entries
      - from
      - in_paise
      - opening_paise
      - out_paise
      - reconciled
      - to
    AttendanceBefore:
      type: object
      properties:
        member:
          type: integer
      required:
      - member
    AttendanceBranch:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        member:
          type: integer
        staff:
          type: integer
      required:
      - id
      - member
      - name
      - staff
    AttendanceDay:
      type: object
      properties:
        date:
          type: string
          format: date
        member:
          type: integer
        staff:
          type: integer
      required:
      - date
      - member
      - staff
    AttendanceReport:
      type: object
      properties:
        previous:
          allOf:
          - $ref: '#/components/schemas/ReportPrevious'
          description: The same number of days just before, which trends compare against
        totals:
          $ref: '#/components/schemas/AttendanceTotals'
        before:
          $ref: '#/components/schemas/AttendanceBefore'
        series:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceDay'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceSession'
        branches:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceBranch'
          description: Every branch, when the report covers them all; empty for one
            branch
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: integer
          description: Days counted, both ends included
      required:
      - before
      - branches
      - days
      - from
      - previous
      - series
      - sessions
      - to
      - totals
    AttendanceSession:
      type: object
      properties:
        session:
          type: string
        member:
          type: integer
        trainer:
          type: integer
        receptionist:
          type: integer
        admin:
          type: integer
      required:
      - admin
      - member
      - receptionist
      - session
      - trainer
    AttendanceTotals:
      type: object
      properties:
        member:
          type: integer
        trainer:
          type: integer
        receptionist:
          type: integer
        admin:
          type: integer
      required:
      - admin
      - member
      - receptionist
      - trainer
    AutomationSchedule:
      type: object
      description: Dumbelo's times, for every gym that has no times of its own.
      properties:
        reminder_hour:
          type: integer
          maximum: 23
          minimum: 0
        days_ahead:
          type: array
          items:
            type: integer
            maximum: 60
            minimum: 1
          maxItems: 3
          minItems: 1
        invoice_hour:
          type: integer
          maximum: 23
          minimum: 0
        updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_by_name:
          type: string
          readOnly: true
          nullable: true
      required:
      - days_ahead
      - invoice_hour
      - reminder_hour
      - updated_at
      - updated_by_name
    BillsDue:
      type: object
      properties:
        count:
          type: integer
        overdue:
          type: integer
        total_paise:
          type: integer
      required:
      - count
      - overdue
      - total_paise
    Branch:
      type: object
      description: A branch with its opening sessions. Sending `sessions` replaces
        the whole list (as the Edit Branch form does).
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        address:
          type: string
        phone:
          type: string
          maxLength: 20
        days_open:
          $ref: '#/components/schemas/DaysOpenEnum'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        qr_code:
          type: string
          readOnly: true
          description: 'Printed on the wall QR: /checkin/<qr_code>'
        is_active:
          type: boolean
      required:
      - id
      - name
      - qr_code
      - sessions
    BranchAccountRequest:
      type: object
      properties:
        branch:
          type: integer
        account:
          type: integer
          nullable: true
          description: The bank account it uses from now on; null for none
      required:
      - account
      - branch
    BranchAsk:
      type: object
      description: A request for more branches, as the gym's admins see it.
      properties:
        id:
          type: integer
          readOnly: true
        count:
          type: integer
          readOnly: true
        note:
          type: string
          readOnly: true
          description: What the admin told Dumbelo, e.g. where it opens
        status:
          allOf:
          - $ref: '#/components/schemas/BranchAskStatusEnum'
          readOnly: true
        asked_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        decline_reason:
          type: string
          readOnly: true
        charged_from:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: The gym's day it was approved
        charged_to:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Last day of that billing month
        days_charged:
          type: integer
          readOnly: true
          nullable: true
        period_days:
          type: integer
          readOnly: true
          nullable: true
          description: Days in that billing month
        rate_paise:
          type: integer
          readOnly: true
          nullable: true
          description: The per-branch fee it was worked out at
        pro_rata_paise:
          type: integer
          readOnly: true
          nullable: true
      required:
      - asked_by_name
      - charged_from
      - charged_to
      - count
      - created_at
      - days_charged
      - decided_at
      - decline_reason
      - id
      - note
      - period_days
      - pro_rata_paise
      - rate_paise
      - status
    BranchAskCreateRequest:
      type: object
      properties:
        count:
          type: integer
          maximum: 5
          minimum: 1
        note:
          type: string
          default: ''
          maxLength: 200
    BranchAskStatusEnum:
      enum:
      - asked
      - approved
      - declined
      type: string
      description: |-
        * `asked` - Asked
        * `approved` - Approved
        * `declined` - Declined
    BranchCash:
      type: object
      description: 'A branch''s cash in hand, as the desk sees it: what it holds now
        and today''s count.'
      properties:
        branch:
          type: integer
        branch_name:
          type: string
        account:
          type: integer
          nullable: true
          description: Its cash in hand; null when it isn't set up
        balance_paise:
          type: integer
          nullable: true
          description: What the drawer should hold now
        in_paise:
          type: integer
          description: 'Cash that came in today: payments and money moved in'
        out_paise:
          type: integer
          description: 'Cash that went out today: expenses, refunds and money moved
            out'
        close:
          allOf:
          - $ref: '#/components/schemas/DrawerClose'
          nullable: true
          description: Today's count, if the desk has counted
      required:
      - account
      - balance_paise
      - branch
      - branch_name
      - close
      - in_paise
      - out_paise
    BranchMoney:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        cash:
          allOf:
          - $ref: '#/components/schemas/AccountBrief'
          nullable: true
        bank:
          allOf:
          - $ref: '#/components/schemas/AccountBrief'
          nullable: true
      required:
      - bank
      - cash
      - id
      - name
    BranchRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    BranchRequest:
      type: object
      description: A branch with its opening sessions. Sending `sessions` replaces
        the whole list (as the Edit Branch form does).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        address:
          type: string
        phone:
          type: string
          maxLength: 20
        days_open:
          $ref: '#/components/schemas/DaysOpenEnum'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionRequest'
        is_active:
          type: boolean
      required:
      - name
      - sessions
    CategoryEnum:
      enum:
      - rent
      - salaries
      - utilities
      - equipment
      - maintenance
      - supplies
      - marketing
      - other
      type: string
