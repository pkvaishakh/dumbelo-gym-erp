  /api/messages/:
    get:
      operationId: messages_list
      description: |-
        The messages a gym has sent, newest first: More → Messages, and a member's profile.

        Messages go out by themselves; the one thing to post is Retry, for an admin, on a message that failed. Trainers
        and members are out because a dues reminder says the amount; the desk sees only its branches' members' messages.
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: For this day or later (the gym's days), YYYY-MM-DD
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - dumbelo_invoice_due
          - dumbelo_payment_received
          - payment_due
          - payment_received
          - plan_ending
          - plan_ends_today
          - task_assigned
        description: |-
          * `plan_ending` - Plan ending soon
          * `plan_ends_today` - Plan ends today
          * `payment_due` - Payment due
          * `payment_received` - Payment received
          * `task_assigned` - Task assigned
          * `dumbelo_invoice_due` - Dumbelo invoice due
          * `dumbelo_payment_received` - Dumbelo payment received
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: member
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Their name or number (4 digits or more), 2 characters or more
      - in: query
        name: recipient
        schema:
          type: string
          enum:
          - member
          - staff
        description: |-
          * `member` - A member
          * `staff` - A staff member
      - in: query
        name: status
        schema:
          type: string
          enum:
          - delivered
          - failed
          - queued
          - read
          - sent
        description: |-
          * `queued` - Sending
          * `sent` - Sent
          * `delivered` - Delivered
          * `read` - Read
          * `failed` - Failed
      - in: query
        name: to
        schema:
          type: string
        description: For this day or earlier, YYYY-MM-DD
      tags:
      - messages
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessageList'
          description: ''
