components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/AccountKindEnum'
        label:
          type: string
          readOnly: true
          description: The bank account's name, or the branch's name and cash
        name:
          type: string
          description: 'Bank accounts: what the gym calls it, like HDFC current account'
          maxLength: 80
        branch:
          type: integer
          nullable: true
          description: 'Cash in hand: the branch whose cash it is'
        branch_name:
          type: string
          readOnly: true
          nullable: true
        branches:
          type: array
          items:
            type: integer
          description: 'Bank accounts: the branches that use it. A branch using another
            account moves here'
        branch_names:
          type: array
          items:
            type: string
          readOnly: true
        bank_name:
          type: string
          maxLength: 80
        account_number:
          type: string
          maxLength: 20
        ifsc:
          type: string
          maxLength: 11
        opening_balance_paise:
          type: integer
          maximum: 100000000000
          minimum: 0
          format: int64
        opened_on:
          type: string
          format: date
          readOnly: true
          description: 'The day it was added to Rackline: money recorded from then
            on moves its balance'
        is_active:
          type: boolean
          readOnly: true
        balance_paise:
          type: integer
          readOnly: true
        collected_paise:
          type: integer
          readOnly: true
          description: Payments taken into it since it was added
        spent_paise:
          type: integer
          readOnly: true
          description: Expenses paid from it since it was added
        refunded_paise:
          type: integer
          readOnly: true
          description: Refunds given from it since it was added
        moved_in_paise:
          type: integer
          readOnly: true
        moved_out_paise:
          type: integer
          readOnly: true
      required:
      - balance_paise
      - branch_name
      - branch_names
      - collected_paise
      - id
      - is_active
      - kind
      - label
      - moved_in_paise
      - moved_out_paise
      - opened_on
      - refunded_paise
      - spent_paise
    AccountBrief:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        balance_paise:
          type: integer
        shared_with:
          type: array
          items:
            type: string
          description: Other branches that use this bank account
      required:
      - balance_paise
      - id
      - name
      - shared_with
    AccountKindEnum:
      enum:
      - cash
      - bank
      type: string
      description: |-
        * `cash` - Cash in hand
