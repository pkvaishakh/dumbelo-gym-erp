openapi: 3.0.3
info:
  title: Dumbelo API
  version: 0.1.0
  description: 'Gym management for many gyms. Send `X-Gym: <gym slug>` with every
    call inside a gym.'
paths:
  /api/accounts/:
    get:
      operationId: accounts_list
      description: |-
        Each branch's cash in hand and the gym's bank accounts, with their balances and the branches each bank account
        serves. Admins only. Never deleted: deactivated, once empty.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - bank
          - cash
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
          description: ''
    post:
      operationId: accounts_create
      description: |-
        Each branch's cash in hand and the gym's bank accounts, with their balances and the branches each bank account
        serves. Admins only. Never deleted: deactivated, once empty.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/accounts/{id}/:
    get:
      operationId: accounts_retrieve
      description: |-
        Each branch's cash in hand and the gym's bank accounts, with their balances and the branches each bank account
        serves. Admins only. Never deleted: deactivated, once empty.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this account.
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    put:
      operationId: accounts_update
      description: |-
        Each branch's cash in hand and the gym's bank accounts, with their balances and the branches each bank account
        serves. Admins only. Never deleted: deactivated, once empty.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this account.
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    patch:
      operationId: accounts_partial_update
      description: |-
        Each branch's cash in hand and the gym's bank accounts, with their balances and the branches each bank account
        serves. Admins only. Never deleted: deactivated, once empty.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this account.
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/accounts/{id}/activate/:
    post:
      operationId: accounts_activate_create
      description: |-
        Each branch's cash in hand and the gym's bank accounts, with their balances and the branches each bank account
        serves. Admins only. Never deleted: deactivated, once empty.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this account.
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/accounts/{id}/deactivate/:
    post:
      operationId: accounts_deactivate_create
      description: Stop using it. It must hold nothing; branches that used it are
        left without a bank account.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this account.
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/accounts/{id}/reconcile/:
    post:
      operationId: accounts_reconcile_create
      description: 'The bank''s statement agrees up to a day: the ticked entries up
        to then are locked.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this account.
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReconcileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReconcileRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reconciliation'
          description: ''
  /api/accounts/{id}/statement/:
    get:
      operationId: accounts_statement_retrieve
      description: |-
        One month of this account, entry by entry with the balance after each, to check against the bank's
        statement or the cash counted at the desk.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this account.
        required: true
      - in: query
        name: month
        schema:
          type: string
        description: YYYY-MM; this month when left out
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStatement'
          description: ''
  /api/accounts/{id}/tick/:
    post:
      operationId: accounts_tick_create
      description: Tick entries on this bank account's statement as on the bank's
        statement too, or untick them.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this account.
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TickRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TickRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TickRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/accounts/{id}/unreconcile/:
    post:
      operationId: accounts_unreconcile_create
      description: Unlock one reconciled entry, with the reason, so it can be corrected
        or voided.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this account.
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnreconcileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UnreconcileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UnreconcileRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/accounts/branch/:
    post:
      operationId: accounts_branch_create
      description: Give a branch the bank account its new UPI, card and bank money
        goes into (or none). Old money stays put.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchAccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BranchAccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BranchAccountRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoneyOverview'
          description: ''
  /api/accounts/overview/:
    get:
      operationId: accounts_overview_retrieve
      description: |-
        The money screen in one call: totals with each account counted once, each branch's cash and bank account,
        and every account.
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoneyOverview'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Sign out: the refresh token stops working, so a copy of it can't be used later. The refresh token is the
        proof, so an expired access token mustn't block it.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refresh'
          description: ''
  /api/billing/branch-requests/:
    get:
      operationId: billing_branch_requests_list
      description: 'Add Branch to My Plan: the gym''s admins ask Dumbelo for room
        for more branches. Dumbelo approves or declines.'
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranchAskList'
          description: ''
    post:
      operationId: billing_branch_requests_create
      description: 'Add Branch to My Plan: the gym''s admins ask Dumbelo for room
        for more branches. Dumbelo approves or declines.'
      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchAskCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BranchAskCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BranchAskCreateRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchAsk'
          description: ''
  /api/billing/branch-requests/{id}/:
    get:
      operationId: billing_branch_requests_retrieve
      description: 'Add Branch to My Plan: the gym''s admins ask Dumbelo for room
        for more branches. Dumbelo approves or declines.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this branch request.
        required: true
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchAsk'
          description: ''
  /api/billing/invoices/:
    get:
      operationId: billing_invoices_list
      description: |-
        The gym's Dumbelo invoices, newest first, each with its lines and its payments' receipts. Admins only, and
        open while the gym is suspended: it's how they see what to settle.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvoiceRowList'
          description: ''
  /api/billing/invoices/{id}/:
    get:
      operationId: billing_invoices_retrieve
      description: |-
        The gym's Dumbelo invoices, newest first, each with its lines and its payments' receipts. Admins only, and
        open while the gym is suspended: it's how they see what to settle.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this invoice.
        required: true
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
          description: ''
  /api/billing/plan/:
    get:
      operationId: billing_plan_retrieve
      description: |-
        What the gym pays Dumbelo and for how many branches. Open while the gym is suspended: its admins can still
        see their plan.
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymPlan'
          description: ''
  /api/branches/:
    get:
      operationId: branches_list
      description: Branches and their opening sessions. Admins change them; everyone
        sees the branches they belong to.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - branches
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranchList'
          description: ''
    post:
      operationId: branches_create
      description: Branches and their opening sessions. Admins change them; everyone
        sees the branches they belong to.
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BranchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BranchRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
  /api/branches/{id}/:
    get:
      operationId: branches_retrieve
      description: Branches and their opening sessions. Admins change them; everyone
        sees the branches they belong to.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this branch.
        required: true
      tags:
      - branches
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
    put:
      operationId: branches_update
      description: Branches and their opening sessions. Admins change them; everyone
        sees the branches they belong to.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this branch.
        required: true
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BranchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BranchRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
    patch:
      operationId: branches_partial_update
      description: Branches and their opening sessions. Admins change them; everyone
        sees the branches they belong to.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this branch.
        required: true
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBranchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBranchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBranchRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
    delete:
      operationId: branches_destroy
      description: Branches and their opening sessions. Admins change them; everyone
        sees the branches they belong to.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this branch.
        required: true
      tags:
      - branches
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/cash/:
    get:
      operationId: cash_list
      description: |-
        Each of the caller's branches' cash in hand: what it should hold now and today's count. The desk sees its own
        branches' cash only (never the bank: a shared account would show other branches' takings). Admins pass ?branch=.
      parameters:
      - in: query
        name: branch
        schema:
          type: integer
      tags:
      - cash
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BranchCash'
          description: ''
  /api/checkins/:
    get:
      operationId: checkins_list
      description: |-
        Who came in. Only the time in is recorded — there is no check-out.

        The desk checks people in; staff see their branches' list; a member sees their own visits; admins can remove
        a mistaken check-in (audited).
      parameters:
      - in: query
        name: branch
        schema:
          type: integer
      - in: query
        name: date
        schema:
          type: string
        description: YYYY-MM-DD, today by default
      - in: query
        name: from
        schema:
          type: string
        description: 'With member or staff: YYYY-MM-DD, the first day'
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - admin
          - member
          - receptionist
          - staff
          - trainer
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: member
        schema:
          type: integer
        description: One member's visits, any day
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: session
        schema:
          type: string
        description: Session name, e.g. Morning; Other for outside every session
      - in: query
        name: source
        schema:
          type: string
      - in: query
        name: staff
        schema:
          type: integer
      - in: query
        name: to
        schema:
          type: string
        description: 'With member or staff: YYYY-MM-DD, the last day'
      tags:
      - checkins
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCheckInList'
          description: ''
    post:
      operationId: checkins_create
      description: |-
        Who came in. Only the time in is recorded — there is no check-out.

        The desk checks people in; staff see their branches' list; a member sees their own visits; admins can remove
        a mistaken check-in (audited).
      tags:
      - checkins
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckInCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckInCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIn'
          description: ''
  /api/checkins/{id}/:
    delete:
      operationId: checkins_destroy
      description: |-
        Who came in. Only the time in is recorded — there is no check-out.

        The desk checks people in; staff see their branches' list; a member sees their own visits; admins can remove
        a mistaken check-in (audited).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this check in.
        required: true
      tags:
      - checkins
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/checkins/qr/:
    post:
      operationId: checkins_qr_create
      description: A signed-in member or staff member scans the branch's wall QR with
        their phone.
      tags:
      - checkins
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QRRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QRRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIn'
          description: ''
  /api/checkins/summary/:
    get:
      operationId: checkins_summary_retrieve
      description: |-
        Counts for the day by session: members, trainers, receptionists — the Attendance and Home cards.

        Without a branch, `branches` also gives each of your branches' member check-ins by source.
      parameters:
      - in: query
        name: branch
        schema:
          type: integer
      - in: query
        name: date
        schema:
          type: string
      tags:
      - checkins
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
