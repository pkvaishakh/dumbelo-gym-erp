components:
  schemas:
    Branch:
      type: object
      description: A branch with its opening sessions. Sending `sessions` replaces
        the whole list (as the Edit Branch form does).
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        address:
          type: string
        phone:
          type: string
          maxLength: 20
        days_open:
          $ref: '#/components/schemas/DaysOpenEnum'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        qr_code:
          type: string
          readOnly: true
          description: 'Printed on the wall QR: /checkin/<qr_code>'
        is_active:
          type: boolean
      required:
      - id
      - name
      - qr_code
      - sessions
    BranchRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    BranchRequest:
      type: object
      description: A branch with its opening sessions. Sending `sessions` replaces
        the whole list (as the Edit Branch form does).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        address:
          type: string
        phone:
          type: string
          maxLength: 20
        days_open:
          $ref: '#/components/schemas/DaysOpenEnum'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionRequest'
        is_active:
          type: boolean
      required:
      - name
      - sessions
    CategoryEnum:
      enum:
      - rent
      - salaries
      - utilities
      - equipment
      - maintenance
      - supplies
      - marketing
      - other
      type: string
      description: |-
        * `rent` - Rent
        * `salaries` - Salaries
        * `utilities` - Utilities
        * `equipment` - Equipment
        * `maintenance` - Maintenance
        * `supplies` - Supplies
        * `marketing` - Marketing
        * `other` - Other
    CheckIn:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/CheckInKindEnum'
          readOnly: true
        person_id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        code:
          type: string
        branch:
          type: integer
        branch_name:
          type: string
        at:
          type: string
          format: date-time
        local_date:
          type: string
          format: date
          description: The day in the gym's time zone; one check-in per person per
            day
        time:
          type: string
          readOnly: true
        session:
          type: string
          nullable: true
          readOnly: true
        source:
          $ref: '#/components/schemas/SourceEnum'
      required:
      - branch
      - branch_name
      - id
      - kind
      - local_date
      - name
      - person_id
      - session
      - source
      - time
    CheckInCreateRequest:
      type: object
      properties:
        branch:
          type: integer
        member:
          type: integer
        staff:
          type: integer
      required:
      - branch
    CheckInKindEnum:
      enum:
      - member
      - admin
      - receptionist
      - trainer
      type: string
      description: |-
        * `member` - member
        * `admin` - admin
        * `receptionist` - receptionist
        * `trainer` - trainer
    CurrentPlan:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        starts:
          type: string
          format: date
        ends:
          type: string
          format: date
      required:
      - ends
      - id
      - name
      - starts
    DaysOpenEnum:
      enum:
      - every_day
      - mon_sat
      type: string
      description: |-
        * `every_day` - Every day
        * `mon_sat` - Monday to Saturday
    DoneRequest:
      type: object
      properties:
        note:
          type: string
          description: A last update, posted before it's marked done
    Expense:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        branch:
          type: integer
        branch_name:
          type: string
          readOnly: true
        category:
          $ref: '#/components/schemas/CategoryEnum'
        amount_paise:
          type: integer
          maximum: 2147483647
          minimum: 0
        method:
          $ref: '#/components/schemas/MethodEnum'
        paid_to:
          type: string
          maxLength: 120
        note:
          type: string
          maxLength: 200
        spent_on:
          type: string
          format: date
      required:
      - amount_paise
      - branch
      - branch_name
      - category
      - id
      - method
    ExpenseRequest:
      type: object
      properties:
        branch:
          type: integer
        category:
          $ref: '#/components/schemas/CategoryEnum'
        amount_paise:
          type: integer
          maximum: 2147483647
          minimum: 0
        method:
          $ref: '#/components/schemas/MethodEnum'
        paid_to:
          type: string
          maxLength: 120
        note:
          type: string
          maxLength: 200
        spent_on:
          type: string
          format: date
      required:
      - amount_paise
      - branch
      - category
      - method
    FreezeRequest:
      type: object
      properties:
        starts:
          type: string
          format: date
        until:
          type: string
          format: date
      required:
      - until
    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
          description: Email (staff) or 10-digit mobile number (members)
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - identifier
      - password
    Me:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        initials:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
      required:
      - email
      - id
      - initials
      - name
      - phone
      - roles
    Member:
      type: object
      description: |-
        What the desk and admins see. On create the desk can also sell the first plan, take the first payment,
        and set the member's app login (their phone + a password).
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
        name:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 13
        email:
          type: string
          format: email
          maxLength: 254
        home_branch:
          type: integer
        trainer:
          type: integer
          nullable: true
        trainer_name:
          type: string
          readOnly: true
        goal:
          type: string
          maxLength: 60
        joined_on:
          type: string
          format: date
        device_user_id:
          type: string
          description: This member's number on the turnstile
          maxLength: 20
        is_archived:
          type: boolean
        status:
          allOf:
          - $ref: '#/components/schemas/MemberStatusEnum'
          readOnly: true
        balance_paise:
          type: integer
          readOnly: true
        plan:
          allOf:
          - $ref: '#/components/schemas/CurrentPlan'
          nullable: true
          readOnly: true
        has_login:
          type: boolean
          readOnly: true
      required:
      - balance_paise
      - has_login
      - home_branch
      - id
      - name
      - phone
      - plan
      - status
      - trainer_name
    MemberRequest:
      type: object
      description: |-
        What the desk and admins see. On create the desk can also sell the first plan, take the first payment,
        and set the member's app login (their phone + a password).
      properties:
        code:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 1
          maxLength: 13
        email:
          type: string
          format: email
          maxLength: 254
        home_branch:
          type: integer
        trainer:
          type: integer
          nullable: true
        goal:
          type: string
          maxLength: 60
        joined_on:
          type: string
          format: date
        device_user_id:
          type: string
          description: This member's number on the turnstile
          maxLength: 20
        is_archived:
          type: boolean
        first_plan:
          type: integer
          writeOnly: true
        offer:
          type: integer
          writeOnly: true
          nullable: true
        paid_paise:
          type: integer
          minimum: 0
          writeOnly: true
        method:
          allOf:
          - $ref: '#/components/schemas/MethodEnum'
          writeOnly: true
        password:
          type: string
          writeOnly: true
          minLength: 6
      required:
      - home_branch
      - name
      - phone
