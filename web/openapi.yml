  /api/support-access/:
    get:
      operationId: support_access_list
      description: |-
        An admin lets Rackline support look inside the gym for a few hours, and can take it back at any time.

        A window is only ever read-only (see `InGym`), one gym at a time, and both the granting and the ending are
        written to the audit log. Windows are never deleted: ending one moves its end to now, so the history keeps
        what really happened.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - support-access
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSupportAccessList'
          description: ''
    post:
      operationId: support_access_create
      description: |-
        An admin lets Rackline support look inside the gym for a few hours, and can take it back at any time.

        A window is only ever read-only (see `InGym`), one gym at a time, and both the granting and the ending are
        written to the audit log. Windows are never deleted: ending one moves its end to now, so the history keeps
        what really happened.
      tags:
      - support-access
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportAccessRequest'
          application/x-www-form-urlencoded:
            schema:
