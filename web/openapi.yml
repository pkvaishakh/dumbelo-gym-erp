      type: object
      description: A new password an admin sets for a receptionist or trainer, and
        tells them.
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - password
    StaffRequest:
      type: object
      description: A trainer, receptionist or admin. Creating one creates their login
        (email + a first password they change).
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        phone:
          type: string
          nullable: true
        password:
          type: string
          writeOnly: true
          minLength: 8
        role:
          $ref: '#/components/schemas/RoleEnum'
        branches:
          type: array
          items:
            type: integer
        is_active:
          type: boolean
        shift:
          type: string
          maxLength: 60
        specialities:
          type: string
          maxLength: 120
        day_off:
          type: string
          maxLength: 12
        device_user_id:
          type: string
          description: This person's number on the turnstile
          maxLength: 20
      required:
      - branches
      - email
      - name
      - role
    StateEnum:
      enum:
      - overdue
      - today
      - soon
      - later
      - paid
      - skipped
      type: string
      description: |-
        * `overdue` - overdue
        * `today` - today
        * `soon` - soon
        * `later` - later
        * `paid` - paid
        * `skipped` - skipped
    StatementEntry:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/StatementEntryKindEnum'
        id:
          type: integer
        member:
          type: integer
          nullable: true
          description: 'Payments: the member who paid'
        'on':
          type: string
          format: date
        title:
          type: string
        meta:
          type: string
        amount_paise:
          type: integer
          description: 'Signed: above zero came in, below zero went out'
        balance_paise:
          type: integer
          description: The balance after this entry
        ticked:
          type: boolean
          description: Matched with the bank's statement
        reconciled:
          type: boolean
          description: 'Locked by a reconciliation: un-reconcile it to correct or
            void it'
      required:
      - amount_paise
      - balance_paise
      - id
      - kind
      - member
      - meta
      - 'on'
      - reconciled
      - ticked
      - title
    StatementEntryKindEnum:
      enum:
      - payment
      - expense
      - move
      - refund
      type: string
      description: |-
        * `payment` - Payment
        * `expense` - Expense
        * `move` - Money move
        * `refund` - Refund
    Subscription:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        member:
          type: integer
        plan:
          type: integer
        plan_name:
          type: string
          readOnly: true
        offer:
          type: integer
          nullable: true
        offer_name:
          type: string
          readOnly: true
        starts:
          type: string
          format: date
        ends:
          type: string
          format: date
          readOnly: true
        list_price_paise:
          type: integer
          readOnly: true
          description: The plan's price at sale
        price_paise:
          type: integer
          readOnly: true
          description: What the member owes for it, after the offer
        paid_paise:
          type: integer
          readOnly: true
        refunded_paise:
          type: integer
          readOnly: true
          description: 'Given back: the price and what was paid are both that much
            lower'
        frozen_from:
          type: string
          format: date
          readOnly: true
          nullable: true
        frozen_until:
          type: string
          format: date
          readOnly: true
          nullable: true
        cancelled:
          type: boolean
          readOnly: true
      required:
      - cancelled
      - ends
      - frozen_from
      - frozen_until
      - id
      - list_price_paise
      - member
      - offer_name
      - paid_paise
      - plan
      - plan_name
      - price_paise
      - refunded_paise
    SubscriptionRequest:
      type: object
      properties:
        member:
          type: integer
        plan:
          type: integer
        offer:
          type: integer
          nullable: true
        starts:
          type: string
          format: date
      required:
      - member
      - plan
    SupportAccess:
      type: object
      description: A window an admin opened for Rackline support. `open` says whether
        it is running right now.
      properties:
        id:
          type: integer
          readOnly: true
        starts:
          type: string
          format: date-time
          readOnly: true
        ends:
          type: string
          format: date-time
          readOnly: true
        granted_by:
          type: integer
          readOnly: true
        granted_by_name:
          type: string
          readOnly: true
        open:
          type: boolean
          readOnly: true
      required:
      - ends
      - granted_by
      - granted_by_name
      - id
      - open
      - starts
    SupportAccessRequest:
      type: object
      description: A window an admin opened for Rackline support. `open` says whether
        it is running right now.
      properties:
        hours:
          type: integer
          maximum: 72
          minimum: 1
          writeOnly: true
          description: How long Rackline support may look
      required:
      - hours
    Task:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 160
        details:
          type: string
        assignee:
          type: integer
        assignee_name:
          type: string
          readOnly: true
        assignee_role:
          type: string
          readOnly: true
        due_date:
          type: string
          format: date
        due_time:
          type: string
          format: time
          nullable: true
          description: Without a time, due by the end of the day
        status:
          allOf:
          - $ref: '#/components/schemas/TaskStatusEnum'
          readOnly: true
        is_overdue:
          type: boolean
          readOnly: true
        created_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updates:
          type: array
          items:
            $ref: '#/components/schemas/TaskUpdate'
          readOnly: true
      required:
      - assignee
      - assignee_name
      - assignee_role
      - created_at
      - created_by_name
      - due_date
      - id
      - is_overdue
      - status
      - title
      - updates
    TaskRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        details:
          type: string
        assignee:
          type: integer
        due_date:
          type: string
          format: date
        due_time:
          type: string
          format: time
          nullable: true
          description: Without a time, due by the end of the day
      required:
      - assignee
      - due_date
      - title
    TaskStatusEnum:
      enum:
      - todo
      - doing
      - done
      type: string
      description: |-
        * `todo` - To do
        * `doing` - In progress
        * `done` - Done
    TaskUpdate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/TaskUpdateKindEnum'
          readOnly: true
        text:
          type: string
        author:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - created_at
      - id
      - kind
      - text
    TaskUpdateKindEnum:
      enum:
      - note
      - status
