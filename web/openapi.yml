    NewGym:
      type: object
      description: 'One gym: its status and why it last changed, and its branches.
        Its admins are their own list.'
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: Sent by the app as the X-Gym header
          pattern: ^[-a-zA-Z0-9_]+$
        status:
          allOf:
          - $ref: '#/components/schemas/GymStatusEnum'
          readOnly: true
        timezone:
          type: string
          readOnly: true
        billing_email:
          type: string
          format: email
          readOnly: true
        branch_count:
          type: integer
          readOnly: true
          description: Active branches
        member_count:
          type: integer
          readOnly: true
          description: Members, leaving out archived ones
        owner_name:
          type: string
          readOnly: true
          nullable: true
        owner_email:
          type: string
          readOnly: true
          nullable: true
        owner_username:
          type: string
          readOnly: true
          nullable: true
          description: How the owner signs in
        owed_paise:
          type: integer
          readOnly: true
          description: What its open Dumbelo invoices still owe
        created_at:
          type: string
          format: date-time
          readOnly: true
        status_reason:
          type: string
          readOnly: true
          description: Why a Dumbelo admin last suspended or activated it
        status_changed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        branches:
          type: array
          items:
            $ref: '#/components/schemas/GymBranch'
          readOnly: true
        owner_new_login:
          type: boolean
          readOnly: true
          description: 'False: the owner already had a Dumbelo login and keeps their
            password'
      required:
      - billing_email
      - branch_count
      - branches
      - created_at
      - id
      - member_count
      - name
      - owed_paise
      - owner_email
      - owner_name
      - owner_new_login
      - owner_username
      - slug
      - status
      - status_changed_at
      - status_reason
      - timezone
