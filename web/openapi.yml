    get:
      operationId: drawer_closes_list
      description: |-
        The desk's end-of-day cash counts: counted, expected and the difference. The desk counts its branches' cash
        and sees one day at a time (today by default), like the day's payments; only admins settle a difference.
      parameters:
      - in: query
        name: branch
        schema:
          type: integer
      - in: query
        name: date
        schema:
          type: string
        description: 'YYYY-MM-DD: counts for that local day'
      - in: query
        name: from
        schema:
          type: string
        description: First local day, YYYY-MM-DD. Admins only when it spans more than
          a day
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: state
        schema:
          type: string
          enum:
          - to_settle
        description: 'to_settle: counts that didn''t match and aren''t settled yet'
      - in: query
        name: to
        schema:
          type: string
        description: Last local day, YYYY-MM-DD
      tags:
      - drawer-closes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDrawerCloseList'
          description: ''
    post:
      operationId: drawer_closes_create
      description: |-
        Count the drawer: today's count for the branch, against what its cash in hand holds now. Counting again
        the same day replaces it, until an admin settles the difference.
      tags:
      - drawer-closes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DrawerCountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DrawerCountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DrawerCountRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
