openapi: 3.0.3
info:
  title: Rackline API
  version: 0.1.0
  description: 'Gym management for many gyms. Send `X-Gym: <gym slug>` with every
    call inside a gym.'
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: 'Sign out: the refresh token stops working, so a copy of it can''t
        be used later.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/branches/:
    get:
      operationId: branches_list
      description: Branches and their opening sessions. Admins change them; everyone
        sees the branches they belong to.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - branches
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranchList'
          description: ''
    post:
      operationId: branches_create
      description: Branches and their opening sessions. Admins change them; everyone
        sees the branches they belong to.
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BranchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BranchRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
  /api/branches/{id}/:
    get:
      operationId: branches_retrieve
      description: Branches and their opening sessions. Admins change them; everyone
        sees the branches they belong to.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this branch.
        required: true
      tags:
      - branches
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
    put:
      operationId: branches_update
      description: Branches and their opening sessions. Admins change them; everyone
        sees the branches they belong to.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this branch.
        required: true
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BranchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BranchRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
    patch:
      operationId: branches_partial_update
      description: Branches and their opening sessions. Admins change them; everyone
        sees the branches they belong to.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this branch.
        required: true
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBranchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBranchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBranchRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
    delete:
      operationId: branches_destroy
      description: Branches and their opening sessions. Admins change them; everyone
        sees the branches they belong to.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this branch.
        required: true
      tags:
      - branches
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/checkins/:
    get:
      operationId: checkins_list
      description: |-
        Who came in. Only the time in is recorded — there is no check-out.

        The desk checks people in; staff see their branches' list; a member sees their own visits; admins can remove
        a mistaken check-in (audited).
      parameters:
      - in: query
        name: branch
        schema:
          type: integer
      - in: query
        name: date
        schema:
          type: string
        description: YYYY-MM-DD, today by default
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - admin
          - member
          - receptionist
          - staff
          - trainer
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: member
        schema:
          type: integer
        description: One member's visits, any day
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: session
        schema:
          type: string
        description: Session name, e.g. Morning
      - in: query
        name: source
        schema:
          type: string
      - in: query
        name: staff
        schema:
          type: integer
      tags:
      - checkins
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCheckInList'
          description: ''
    post:
      operationId: checkins_create
      description: |-
        Who came in. Only the time in is recorded — there is no check-out.

        The desk checks people in; staff see their branches' list; a member sees their own visits; admins can remove
        a mistaken check-in (audited).
      tags:
      - checkins
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckInCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckInCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIn'
          description: ''
  /api/checkins/{id}/:
    delete:
      operationId: checkins_destroy
      description: |-
        Who came in. Only the time in is recorded — there is no check-out.

        The desk checks people in; staff see their branches' list; a member sees their own visits; admins can remove
        a mistaken check-in (audited).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this check in.
        required: true
      tags:
      - checkins
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/checkins/qr/:
    post:
      operationId: checkins_qr_create
      description: A signed-in member or staff member scans the branch's wall QR with
        their phone.
      tags:
      - checkins
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QRRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QRRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIn'
          description: ''
  /api/checkins/summary/:
    get:
      operationId: checkins_summary_retrieve
      description: 'Counts for the day by session: members, trainers, receptionists
        — the Attendance and Home cards.'
      parameters:
      - in: query
        name: branch
        schema:
          type: integer
      - in: query
        name: date
        schema:
          type: string
      tags:
      - checkins
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIn'
          description: ''
  /api/devices/punch/:
    post:
      operationId: devices_punch_create
      description: |-
        A turnstile or biometric reader posts each punch here with its token in X-Device-Token.

        Answers {"open": true} to let them through. A second punch the same day is fine (open, not recorded again);
        an ended or frozen plan answers open: false with the reason so the device can show it.
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PunchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PunchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PunchRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/expenses/:
    get:
      operationId: expenses_list
      description: What the gym spends. Admins only. Filter by ?month=2026-10, branch
        or category.
      parameters:
      - in: query
        name: branch
        schema:
          type: integer
      - in: query
        name: category
        schema:
          type: string
          enum:
          - equipment
          - maintenance
          - marketing
          - other
          - rent
          - salaries
          - supplies
          - utilities
        description: |-
          * `rent` - Rent
          * `salaries` - Salaries
          * `utilities` - Utilities
          * `equipment` - Equipment
          * `maintenance` - Maintenance
          * `supplies` - Supplies
          * `marketing` - Marketing
          * `other` - Other
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: method
        schema:
          type: string
          enum:
          - bank
          - card
          - cash
          - upi
        description: |-
          * `cash` - Cash
          * `upi` - UPI
          * `card` - Card
          * `bank` - Bank transfer
      - in: query
        name: month
        schema:
          type: string
        description: YYYY-MM
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - expenses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExpenseList'
          description: ''
    post:
      operationId: expenses_create
      description: What the gym spends. Admins only. Filter by ?month=2026-10, branch
        or category.
      tags:
      - expenses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: ''
  /api/expenses/{id}/:
    get:
      operationId: expenses_retrieve
      description: What the gym spends. Admins only. Filter by ?month=2026-10, branch
        or category.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this expense.
        required: true
      tags:
      - expenses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: ''
    put:
      operationId: expenses_update
      description: What the gym spends. Admins only. Filter by ?month=2026-10, branch
        or category.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this expense.
        required: true
      tags:
      - expenses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: ''
    patch:
      operationId: expenses_partial_update
      description: What the gym spends. Admins only. Filter by ?month=2026-10, branch
        or category.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this expense.
        required: true
      tags:
      - expenses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExpenseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedExpenseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedExpenseRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: ''
    delete:
      operationId: expenses_destroy
      description: What the gym spends. Admins only. Filter by ?month=2026-10, branch
        or category.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this expense.
        required: true
      tags:
      - expenses
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/expenses/totals/:
    get:
      operationId: expenses_totals_retrieve
      description: Totals by category for the same filters.
      parameters:
      - in: query
        name: month
        schema:
          type: string
        description: YYYY-MM
      tags:
      - expenses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: ''
  /api/me/:
    get:
      operationId: me_retrieve
      description: Who is signed in, and which gyms and branches they can open. The
        app picks a gym and sends it as X-Gym.
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/members/:
    get:
      operationId: members_list
      description: |-
        Members. The desk and admins manage them in their branches; a trainer sees only their own members
        (no amounts); a member sees only themselves.
      parameters:
      - in: query
        name: archived
        schema:
          type: boolean
      - in: query
        name: branch
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Name, member ID or phone
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - attention
          - due
          - expired
          - expiring
          - frozen
          - none
        description: 'attention: anything but active'
      - in: query
        name: trainer
        schema:
          type: integer
      tags:
      - members
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMemberList'
          description: ''
    post:
      operationId: members_create
      description: |-
        Members. The desk and admins manage them in their branches; a trainer sees only their own members
        (no amounts); a member sees only themselves.
      tags:
      - members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MemberRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MemberRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
  /api/members/{id}/:
    get:
      operationId: members_retrieve
      description: |-
        Members. The desk and admins manage them in their branches; a trainer sees only their own members
        (no amounts); a member sees only themselves.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this member.
        required: true
      tags:
      - members
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
    put:
      operationId: members_update
      description: |-
        Members. The desk and admins manage them in their branches; a trainer sees only their own members
        (no amounts); a member sees only themselves.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this member.
        required: true
      tags:
      - members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MemberRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MemberRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
    patch:
      operationId: members_partial_update
      description: |-
        Members. The desk and admins manage them in their branches; a trainer sees only their own members
        (no amounts); a member sees only themselves.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this member.
        required: true
      tags:
      - members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMemberRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMemberRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMemberRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
    delete:
      operationId: members_destroy
      description: |-
        Members. The desk and admins manage them in their branches; a trainer sees only their own members
        (no amounts); a member sees only themselves.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this member.
        required: true
      tags:
      - members
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/members/{id}/history/:
    get:
      operationId: members_history_retrieve
      description: 'Plans and payments for the member profile. Not for trainers: it
        has amounts.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this member.
        required: true
      tags:
      - members
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/members/{id}/notes/:
    get:
      operationId: members_notes_list
      description: |-
        Members. The desk and admins manage them in their branches; a trainer sees only their own members
        (no amounts); a member sees only themselves.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this member.
        required: true
      tags:
      - members
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
          description: ''
    post:
      operationId: members_notes_create
      description: |-
        Members. The desk and admins manage them in their branches; a trainer sees only their own members
        (no amounts); a member sees only themselves.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this member.
        required: true
      tags:
      - members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NoteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NoteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
          description: ''
  /api/members/{id}/set-login/:
    post:
      operationId: members_set_login_create
      description: Set or reset the member's app password. They sign in with their
        phone number.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this member.
        required: true
      tags:
      - members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
        required: true
      security:
      - jwtAuth: []
